<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>行知 Navi</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div id="view-app" class="view app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">行知</span>
          <span class="brand-sub">Navi</span>
        </div>
        <nav class="domains" id="domains" aria-label="领域"></nav>
        <button class="back undo is-hidden" id="btn-undo" title="撤销上一步">↶ 撤销</button>
        <button class="back redo is-hidden" id="btn-redo" title="重做">↷ 重做</button>
        <button class="back" id="btn-search" title="搜索 (Cmd/Ctrl+K)">搜索</button>
        <button class="back" id="btn-gen" title="粘一段近况，AI 帮你建图">AI 建图</button>
        <button class="back" id="btn-ai" title="AI 设置">AI</button>
        <time class="dot-time" id="clock"></time>
      </header>

      <section class="hero">
        <h1 id="greet-title">下午好。</h1>
        <p id="greet-sub">看看现在怎么样，哪儿卡住了，然后做一件小事。</p>
      </section>

      <section class="answer" id="answer">
        <form class="quick-add" id="quick-add">
          <input id="quick-input" maxlength="200" autocomplete="off"
            placeholder="随手记一句：在忙什么、卡在哪、做完了什么…（回车）" />
          <button type="submit" class="np-go" id="quick-btn">记下</button>
        </form>
        <div class="quick-msg" id="quick-msg"></div>
        <div class="ans-block" id="ans-blocked"></div>
        <div class="ans-block" id="ans-today"></div>
        <button class="ans-full" id="btn-fullview">看全貌 ▾</button>
      </section>

      <section class="workspace">
        <div class="panel map-panel">
          <div class="panel-hd">
            <div class="crumbs" id="crumbs"></div>
            <div class="filters">
              <button class="chip back-today" id="btn-backtoday" title="回到今天视图">← 回到今天</button>
              <button class="chip" data-filter="all">全部</button>
              <button class="chip is-on" data-filter="open">还没做完</button>
              <button class="chip" data-filter="today">能今天做完</button>
              <button class="chip" data-filter="blocked">只看卡住的</button>
            </div>
          </div>
          <div class="map-wrap">
            <svg id="map-svg" role="group" aria-label="状态总览"></svg>
          </div>
        </div>
        <aside class="panel detail">
          <div class="detail-body" id="detail-body"></div>
        </aside>
      </section>
    </div>

    <div class="overlay" id="search-overlay">
      <div class="search-card">
        <input id="search-input" type="text" placeholder="搜索领域 / 项目 / 具体的事…（Esc 关闭）" autocomplete="off" />
        <ul class="search-results" id="search-results"></ul>
      </div>
    </div>

    <div class="overlay" id="overlay">
      <div class="focus-card">
        <div class="detail-kicker">开始做</div>
        <h3 id="focus-title">正在做</h3>
        <p id="focus-desc"></p>
        <div class="timer" id="timer">25:00</div>
        <div class="focus-actions">
          <button class="cta" id="btn-done">做完了</button>
          <button class="cta ghost" id="btn-stop">先到这儿，回去看看</button>
        </div>
      </div>
    </div>

    <div class="overlay" id="edit-overlay">
      <form class="edit-card" id="edit-form">
        <div class="detail-kicker" id="edit-kicker">编辑</div>
        <h3 id="edit-title">编辑节点</h3>
        <label class="fld"><span>名称</span><input name="name" maxlength="40" required /></label>
        <label class="fld"><span>下一步做什么</span><input name="nextAction" maxlength="60" /></label>
        <label class="fld"><span>一句提示</span><textarea name="nextHint" rows="2" maxlength="160"></textarea></label>
        <label class="fld"><span>现在怎么样</span><textarea name="brief" rows="2" maxlength="160"></textarea></label>
        <div class="fld-row">
          <label class="fld"><span>预计分钟</span><input name="estimateMin" type="number" min="0" max="600" /></label>
          <label class="fld"><span>状态</span>
            <select name="status">
              <option value="active">正在做</option>
              <option value="blocked">卡住了</option>
              <option value="waiting">在等前面的事</option>
              <option value="flowing">顺利</option>
              <option value="done">已完成</option>
            </select>
          </label>
        </div>
        <div class="fld" id="edit-deps-wrap"><span>在等哪些事（依赖）</span><div class="dep-picker" id="edit-deps"></div></div>
        <div class="edit-actions">
          <button type="submit" class="cta" id="edit-save">保存</button>
          <button type="button" class="cta ghost" id="edit-cancel">取消</button>
        </div>
      </form>
    </div>

    <div class="overlay" id="gen-overlay">
      <form class="edit-card" id="gen-form">
        <div class="detail-kicker">AI 建图</div>
        <h3>粘一段近况，自动建图</h3>
        <p class="ai-note">把最近在忙的、待办、卡点粘进来，AI 会拆成「领域 › 项目 › 具体的事」加到当前成员的图上（可撤销）。需要先在「AI」里配好接口。</p>
        <label class="fld"><span>你的近况 / 待办</span><textarea name="text" rows="7" maxlength="2000" placeholder="例：这周要出方案，卡在还差两场用户访谈；另外在学 MySQL 事务，想搞懂三种读问题；周末要陪家里人体检…"></textarea></label>
        <div class="edit-actions">
          <button type="submit" class="cta" id="gen-run">生成</button>
          <button type="button" class="cta ghost" id="gen-cancel">取消</button>
        </div>
      </form>
    </div>

    <div class="overlay" id="ai-overlay">
      <form class="edit-card" id="ai-form">
        <div class="detail-kicker">接入大模型</div>
        <h3>AI 设置（OneAPI）</h3>
        <p class="ai-note">用 OpenAI 兼容接口生成「下一步」。Key 明文存在本机浏览器，仅建议内网 / 本地使用。</p>
        <label class="fld"><span>接口地址 Base URL</span><input name="baseUrl" placeholder="https://oneapi-comate.baidu-int.com/v1" /></label>
        <label class="fld"><span>API Key</span><input name="apiKey" type="password" placeholder="sk-..." autocomplete="off" /></label>
        <label class="fld"><span>模型 Model</span><input name="model" placeholder="gpt-4o-mini" /></label>
        <div class="edit-actions">
          <button type="submit" class="cta" id="ai-save">保存</button>
          <button type="button" class="cta ghost" id="ai-clear">清除</button>
          <button type="button" class="cta ghost" id="ai-cancel">取消</button>
        </div>
      </form>
    </div>

    <script src="js/data.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/map.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
